        <script>
            /* =========================
            FUEGOS ARTIFICIALES
            ========================= */
            function createFirework() {
                const fw = document.createElement('div');
                fw.className = 'firework';

                const size = Math.random() * 6 + 4;
                const duration = Math.random() * 0.8 + 1.4;

                fw.style.left = Math.random() * 100 + 'vw';
                fw.style.top = Math.random() * 80 + 'vh';
                fw.style.width = size + 'px';
                fw.style.height = size + 'px';
                fw.style.animationDuration = duration + 's';

                document.body.appendChild(fw);
                setTimeout(() => fw.remove(), duration * 1000);
            }

            setInterval(createFirework, 400);

            /* =========================
            SONIDO FUEGOS
            ========================= */
            const fireSound = document.getElementById('fire-sound');
            const soundBtn = document.getElementById('soundToggle');

            let soundOn = false;

            soundBtn.addEventListener('click', () => {
                if (!soundOn) {
                    fireSound.currentTime = 0;
                    fireSound.volume = 0.6;
                    fireSound.loop = true;

                    fireSound.play().then(() => {
                        soundBtn.textContent = '🔇';
                        soundBtn.classList.add('active');
                        soundOn = true;
                    }).catch(err => {
                        console.log('No se pudo reproducir:', err);
                    });

                } else {
                    fireSound.pause();
                    soundBtn.textContent = '🔊';
                    soundBtn.classList.remove('active');
                    soundOn = false;
                }
            });

            const track = document.querySelector('.carousel-track');
            const slides = Array.from(track.children);
            const nextBtn = document.querySelector('.carousel-btn.next');
            const prevBtn = document.querySelector('.carousel-btn.prev');

            let index = 0;

            function updateCarousel() {
                track.style.transform = `translateX(-${index * 100}%)`;
            }

            nextBtn.addEventListener('click', () => {
                index = (index + 1) % slides.length;
                updateCarousel();
            });

            prevBtn.addEventListener('click', () => {
                index = (index - 1 + slides.length) % slides.length;
                updateCarousel();
            });

            /* Swipe táctil */
            let startX = 0;

            track.addEventListener('touchstart', e => {
                startX = e.touches[0].clientX;
            });

            track.addEventListener('touchend', e => {
                const endX = e.changedTouches[0].clientX;
                const diff = startX - endX;

                if (diff > 50) nextBtn.click();
                if (diff < -50) prevBtn.click();
            });

        </script>
